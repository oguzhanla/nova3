name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          if [ -f "novastream-tv.zip" ]; then
            echo "novastream-tv.zip bulundu, çıkartılıyor..."
            unzip -o novastream-tv.zip
          fi
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Install Capacitor Android & Sync
        run: |
          npm install @capacitor/android @capacitor/core @capacitor/cli --legacy-peer-deps
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaStream-TV-APK
          path: android/app/build/outputs/apk/debug/*.apk
