name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          if [ -f "novastream-tv.zip" ]; then
            echo "novastream-tv.zip bulundu, çıkartılıyor..."
            unzip -o novastream-tv.zip
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Install Capacitor Android & Sync
        run: |
          npm install @capacitor/android @capacitor/core @capacitor/cli --legacy-peer-deps
          npx cap add android || true
          npx cap sync android

      - name: Configure Gradle & Kotlin Fixes
        run: |
          # Java 21 uyumluluğu ve duplicate kotlin sınıflarını engelleme ayarları
          cat << 'EOF' >> android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.stdlib.default.dependency=false
          EOF

          # Çakışan eski jdk7 ve jdk8 kütüphanelerini Gradle konfigürasyonundan dışla
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaStream-TV-APK
          path: android/app/build/outputs/apk/debug/*.apk
